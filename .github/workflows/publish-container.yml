name: Publish Container

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Validate semantic tag
        run: |
          case "${GITHUB_REF_NAME}" in
            v0|v*.0[0-9]*|v*.*.0[0-9]*) exit 1 ;;
          esac
          echo "${GITHUB_REF_NAME}" | grep -E '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
      - name: Checkout
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Verify tag is on main
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: Set up QEMU
        # docker/setup-qemu-action v4.2.0
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8
      - name: Set up Buildx
        # docker/setup-buildx-action v4.2.0
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c
      - name: Login to GHCR
        # docker/login-action v4.6.0
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Metadata
        id: meta
        # docker/metadata-action v6.2.0
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302
        with:
          images: ghcr.io/marketingboer/whatsapp-readonly-bridge
          tags: |
            type=raw,value=latest
            type=semver,pattern={{major}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{version}}
      - name: Build and push
        id: build
        # docker/build-push-action v7.3.0
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          sbom: true
          provenance: mode=max
          build-args: |
            VCS_REF=${{ github.sha }}
      - name: Verify published platforms
        run: |
          set -euo pipefail
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          if ! echo "${{ secrets.GITHUB_TOKEN }}" \
              | docker login ghcr.io -u "${GITHUB_REPOSITORY_OWNER}" --password-stdin; then
            echo "WARN: login for repository owner token principal not accepted; continuing with actor credentials." >&2
          fi

          semver_tag="${GITHUB_REF_NAME#v}"
          major="${semver_tag%%.*}"
          minor="${semver_tag#*.}"
          minor="${minor%%.*}"

          image_refs=(
            "ghcr.io/${{ github.repository_owner }}/whatsapp-readonly-bridge:${semver_tag}"
            "ghcr.io/${{ github.repository_owner }}/whatsapp-readonly-bridge:${major}.${minor}"
            "ghcr.io/${{ github.repository_owner }}/whatsapp-readonly-bridge:${major}"
            "ghcr.io/${{ github.repository_owner }}/whatsapp-readonly-bridge:latest"
            "ghcr.io/${{ github.repository_owner }}/whatsapp-readonly-bridge:${GITHUB_REF_NAME}"
          )

          if [ -n "${{ steps.build.outputs.imageid }}" ]; then
            image_refs+=("${{ steps.build.outputs.imageid }}")
            if [[ "${{ steps.build.outputs.imageid }}" == sha256:* ]]; then
              image_refs+=("ghcr.io/${{ github.repository_owner }}/whatsapp-readonly-bridge@${{ steps.build.outputs.imageid }}")
            fi
          fi

          if [ -n "${{ steps.build.outputs.digest }}" ]; then
            image_refs+=("${{ steps.build.outputs.digest }}")
            image_refs+=("ghcr.io/${{ github.repository_owner }}/whatsapp-readonly-bridge@${{ steps.build.outputs.digest }}")
          fi

          for image_ref in "${image_refs[@]}"; do
            if docker buildx imagetools inspect "$image_ref"; then
              echo "Verified published image: $image_ref"
              exit 0
            fi
            echo "WARN: image inspect failed for $image_ref" >&2
          done
          echo "ERROR: verify published platforms failed for all candidate references" >&2
          exit 1
